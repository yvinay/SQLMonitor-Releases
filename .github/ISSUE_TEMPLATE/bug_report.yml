name: Report a problem
description: Something is wrong, confusing or slow.
labels: ["bug", "beta"]
body:
  - type: markdown
    attributes:
      value: "Thanks for testing! **Don't include passwords, server names or confidential query text** - issues are public."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to ...\n2. Click ...\n3. See ..."
  - type: input
    id: version
    attributes:
      label: Version
      description: Filled in automatically when you use Send feedback in the app (About page shows it too).
    validations:
      required: true
  - type: input
    id: platforms
    attributes:
      label: Platforms monitored
      placeholder: Azure SQL Database, SQL Server 2019, PostgreSQL 16 ...
  - type: input
    id: page
    attributes:
      label: Page
  - type: dropdown
    id: impact
    attributes:
      label: How much does this affect you?
      options: ["Blocks me from using it", "Annoying but I can work around it", "Minor / cosmetic"]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or log
      description: "Copy from the screen or %APPDATA%\\SQLMonitor\\sqlmonitor.log (remove anything confidential)."
      render: text
