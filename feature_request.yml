name: Suggest an improvement
description: A feature you need, or something your current tool does better.
labels: ["enhancement", "beta"]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like?
      description: Describe the problem you want solved, not only the solution.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Estate overview, Advisor, Response time, Locks & deadlocks, Queries, Health checks, Cost, Alerts & notifications, Setup & installation, New platform support, Other]
    validations:
      required: true
  - type: input
    id: current_tool
    attributes:
      label: What do you use today?
      description: Optional - e.g. Redgate Monitor, SolarWinds DPA, SQL Sentry, Datadog, scripts.
  - type: dropdown
    id: importance
    attributes:
      label: How important is it?
      options: ["I'd switch tools for it", "Important", "Nice to have"]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
  - type: input
    id: platforms
    attributes:
      label: Platforms monitored
  - type: input
    id: page
    attributes:
      label: Page
